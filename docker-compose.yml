version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: visiontrack-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visiontrack}
      POSTGRES_USER: ${POSTGRES_USER:-visiontrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visiontrack_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visiontrack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: visiontrack-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: visiontrack-backend
    restart: always
    env_file:
      - .env
    environment:
      - DB_ENGINE=postgres
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - USE_REDIS_CHANNEL=True
    volumes:
      - ./backend/media:/app/backend/media
      - ./backend/staticfiles:/app/backend/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: visiontrack-worker
    restart: always
    env_file:
      - .env
    environment:
      - DB_ENGINE=postgres
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_ALWAYS_EAGER=False
    volumes:
      - ./backend/media:/app/backend/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: visiontrack-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: visiontrack-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
